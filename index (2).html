<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سباق السرعة</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#e4572e">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3efe6;--fg:#1d2b36;--panel:#fff;--accent:#e4572e}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191f;--fg:#eef1f4;--panel:#1f2730;--accent:#ff7a4d}}
:root[data-theme="dark"]{--bg:#14191f;--fg:#eef1f4;--panel:#1f2730;--accent:#ff7a4d}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.bar{display:flex;gap:14px;font-size:15px;font-weight:700;width:min(92vw,360px);justify-content:space-between}
.wrap{position:relative;width:min(92vw,360px)}
canvas{width:100%;height:auto;aspect-ratio:3/4;display:block;border-radius:14px;background:#3b3f45;touch-action:none}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,18,.78);color:#fff;border-radius:14px;text-align:center;padding:16px}
.ov h1{margin:0;font-size:30px}.ov p{margin:0;font-size:15px;opacity:.85}
button{font:inherit;font-weight:700;font-size:18px;padding:10px 28px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.cars{display:flex;gap:10px}
.cars button{width:44px;height:44px;padding:0;border-radius:50%;border:3px solid transparent}
.cars button.on{border-color:#fff}
.ctl{display:flex;gap:10px;width:min(92vw,360px)}
.ctl button{flex:1;background:var(--panel);color:var(--fg);font-size:24px;padding:10px}
.ctl .s{flex:0 0 56px}
</style>
</head>
<body>
<div class="bar"><span>النقاط <b id="sc">0</b></span><span>المستوى <b id="lv">1</b></span><span>🪙 <b id="cn">0</b></span><span>الأفضل <b id="bs">0</b></span></div>
<div class="wrap">
  <canvas id="c" width="360" height="480"></canvas>
  <div class="ov" id="ov"><h1 id="t">سباق السرعة</h1><p id="m">اجمع العملات وتفادَ السيارات. اسحب أو اضغط على جانبي الشاشة للتحرك.</p>
  <div class="cars" id="cars"></div><button id="go">ابدأ</button></div>
</div>
<div class="ctl"><button id="L" aria-label="يسار">◀</button><button class="s" id="P" aria-label="إيقاف مؤقت">⏸</button><button class="s" id="S" aria-label="الصوت">🔊</button><button id="R" aria-label="يمين">▶</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=360,H=480,LANES=3,LW=W/LANES,CW=44,CH=76,PY=H-70;
const $=id=>document.getElementById(id);
const COLORS=['#e4572e','#4f8cff','#f2c230','#2fbf71','#8e5cf0'];
const ENEMY=['#4f8cff','#f2c230','#8e5cf0','#2fbf71','#9aa5b1'];
let best=0,total=0,carIdx=0,mute=false;
try{best=+localStorage.getItem('raceBest')||0;total=+localStorage.getItem('raceCoins')||0;carIdx=+localStorage.getItem('raceCar')||0;mute=localStorage.getItem('raceMute')==='1'}catch(e){}
function save(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let lane,px,enemies,coins,speed,score,level,run,off,running,paused,spawn,cspawn,last,flash;
let ac;
function beep(f,d,type,v){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=type||'square';o.frequency.value=f;g.gain.value=v||.07;o.connect(g);g.connect(ac.destination);o.start();g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+d);o.stop(ac.currentTime+d)}catch(e){}}
function ui(){$('sc').textContent=score;$('lv').textContent=level;$('cn').textContent=total+run;$('bs').textContent=best;$('S').textContent=mute?'🔇':'🔊'}
function reset(){lane=1;px=lane*LW+LW/2;enemies=[];coins=[];speed=230;score=0;level=1;run=0;off=0;spawn=0;cspawn=1.5;flash=0;ui()}
function car(cx,cy,col){x.fillStyle=col;x.beginPath();x.roundRect(cx-CW/2,cy-CH/2,CW,CH,8);x.fill();x.fillStyle='rgba(255,255,255,.55)';x.fillRect(cx-CW/2+6,cy-CH/2+14,CW-12,14);x.fillStyle='rgba(0,0,0,.35)';x.fillRect(cx-CW/2+6,cy+CH/2-24,CW-12,10)}
function draw(){
  x.fillStyle='#3b3f45';x.fillRect(0,0,W,H);
  x.fillStyle='#2f7d4f';x.fillRect(0,0,6,H);x.fillRect(W-6,0,6,H);
  x.fillStyle='#e9e9e9';
  for(let i=1;i<LANES;i++)for(let y=-40+off%80;y<H;y+=80)x.fillRect(i*LW-2,y,4,40);
  coins.forEach(c=>{x.fillStyle='#f2c230';x.beginPath();x.arc(c.x,c.y,11,0,7);x.fill();x.fillStyle='#b8860b';x.beginPath();x.arc(c.x,c.y,6,0,7);x.fill()});
  enemies.forEach(e=>car(e.x,e.y,e.c));
  car(px,PY,COLORS[carIdx]);
  if(flash>0){x.fillStyle='rgba(255,255,255,'+Math.min(1,flash)+')';x.font='bold 40px sans-serif';x.textAlign='center';x.fillText('المستوى '+level,W/2,H/2);}
}
function move(d){if(running&&!paused)lane=Math.max(0,Math.min(LANES-1,lane+d))}
function end(){
  running=false;total+=run;save('raceCoins',total);
  const nb=score>best;if(nb){best=score;save('raceBest',best)}
  beep(140,.5,'sawtooth',.1);try{navigator.vibrate&&navigator.vibrate(200)}catch(e){}
  $('t').textContent='انتهت اللعبة';
  $('m').textContent='النقاط: '+score+(nb?' 🏆 رقم قياسي جديد!':'')+' — عملات الجولة: '+run;
  $('go').textContent='العب مرة أخرى';$('ov').style.display='flex';ui();
}
function tick(t){
  if(!running)return;
  if(paused){last=t;requestAnimationFrame(tick);return}
  const dt=Math.min((t-last)/1000,.05);last=t;
  px+=(lane*LW+LW/2-px)*Math.min(1,dt*14);
  off+=speed*dt;speed+=dt*5;score+=Math.max(1,Math.round(speed*dt/10));
  const nl=1+Math.floor(score/400);
  if(nl>level){level=nl;flash=1.4;beep(660,.12);setTimeout(()=>beep(880,.18),120)}
  if(flash>0)flash-=dt;
  spawn-=dt;cspawn-=dt;
  if(spawn<=0){enemies.push({x:Math.floor(Math.random()*LANES)*LW+LW/2,y:-CH,c:ENEMY[Math.floor(Math.random()*ENEMY.length)],v:speed*.35});spawn=Math.max(.42,1.1-speed/950)}
  if(cspawn<=0){coins.push({x:Math.floor(Math.random()*LANES)*LW+LW/2,y:-20});cspawn=1.2+Math.random()*1.5}
  for(const e of enemies){e.y+=(speed-e.v)*dt;if(Math.abs(e.x-px)<CW-6&&Math.abs(e.y-PY)<CH-8){end();return}}
  for(const c of coins){c.y+=speed*dt;if(!c.got&&Math.abs(c.x-px)<CW/2+10&&Math.abs(c.y-PY)<CH/2+10){c.got=1;run++;score+=25;beep(1200,.08,'sine',.09)}}
  enemies=enemies.filter(e=>e.y<H+CH);coins=coins.filter(c=>!c.got&&c.y<H+20);
  ui();draw();requestAnimationFrame(tick);
}
function start(){reset();$('ov').style.display='none';running=true;paused=false;$('P').textContent='⏸';last=performance.now();beep(520,.1);requestAnimationFrame(tick)}
function pause(){if(!running)return;paused=!paused;$('P').textContent=paused?'▶':'⏸'}
function buildCars(){const b=$('cars');b.innerHTML='';COLORS.forEach((c,i)=>{const e=document.createElement('button');e.style.background=c;e.setAttribute('aria-label','سيارة '+(i+1));if(i===carIdx)e.className='on';e.onclick=()=>{carIdx=i;save('raceCar',i);buildCars();draw()};b.appendChild(e)})}
$('go').onclick=start;$('L').onclick=()=>move(-1);$('R').onclick=()=>move(1);$('P').onclick=pause;
$('S').onclick=()=>{mute=!mute;save('raceMute',mute?'1':'0');ui()};
let sx=null;
cv.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
cv.addEventListener('touchend',e=>{if(sx===null)return;const ex=e.changedTouches[0].clientX,dx=ex-sx,r=cv.getBoundingClientRect();
  if(Math.abs(dx)>25)move(dx>0?1:-1);else move(ex<r.left+r.width/2?-1:1);sx=null});
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d')move(1);
  else if(e.key==='p'||e.key==='P')pause();
  else if((e.key==='Enter'||e.key===' ')&&!running){e.preventDefault();start()}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&running&&!paused)pause()});
buildCars();reset();draw();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>
