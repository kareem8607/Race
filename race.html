<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سباق السرعة</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3efe6;--fg:#1d2b36;--panel:#ffffff;--accent:#e4572e}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191f;--fg:#eef1f4;--panel:#1f2730;--accent:#ff7a4d}}
:root[data-theme="dark"]{--bg:#14191f;--fg:#eef1f4;--panel:#1f2730;--accent:#ff7a4d}
*{box-sizing:border-box}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:"Tajawal","Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.bar{display:flex;gap:24px;font-size:18px;font-weight:700}
.wrap{position:relative;width:min(92vw,360px)}
canvas{width:100%;height:auto;aspect-ratio:3/4;display:block;border-radius:14px;background:#3b3f45}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:rgba(10,14,18,.72);color:#fff;border-radius:14px;text-align:center;padding:16px}
.ov h1{margin:0;font-size:30px}
.ov p{margin:0;font-size:15px;opacity:.85}
button{font:inherit;font-weight:700;font-size:18px;padding:10px 28px;border:0;border-radius:10px;background:var(--accent);color:#fff;cursor:pointer}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.ctl{display:flex;gap:12px;width:min(92vw,360px)}
.ctl button{flex:1;background:var(--panel);color:var(--fg);font-size:26px;padding:12px}
</style>
</head>
<body>
<div class="bar"><span>النقاط: <b id="sc">0</b></span><span>أفضل نتيجة: <b id="bs">0</b></span></div>
<div class="wrap">
  <canvas id="c" width="360" height="480"></canvas>
  <div class="ov" id="ov"><h1 id="t">سباق السرعة</h1><p id="m">تفادَ السيارات وانطلق بأقصى سرعة. استخدم الأسهم أو الأزرار.</p><button id="go">ابدأ</button></div>
</div>
<div class="ctl"><button id="L" aria-label="يسار">◀</button><button id="R" aria-label="يمين">▶</button></div>
<script>
const cv=document.getElementById('c'),x=cv.getContext('2d');
const W=360,H=480,LANES=3,LW=W/LANES,CW=44,CH=76;
const scEl=document.getElementById('sc'),bsEl=document.getElementById('bs'),ov=document.getElementById('ov');
let best=0;try{best=+localStorage.getItem('raceBest')||0}catch(e){}
bsEl.textContent=best;
let lane,px,enemies,speed,score,off,running,spawn,last;
const colors=['#4f8cff','#f2c230','#8e5cf0','#2fbf71'];
function reset(){lane=1;px=lane*LW+LW/2;enemies=[];speed=240;score=0;off=0;spawn=0;scEl.textContent=0}
function car(cx,cy,col){
  x.fillStyle=col;x.beginPath();x.roundRect(cx-CW/2,cy-CH/2,CW,CH,8);x.fill();
  x.fillStyle='rgba(255,255,255,.55)';x.fillRect(cx-CW/2+6,cy-CH/2+14,CW-12,14);
  x.fillStyle='rgba(0,0,0,.35)';x.fillRect(cx-CW/2+6,cy+CH/2-24,CW-12,10);
}
function draw(){
  x.fillStyle='#3b3f45';x.fillRect(0,0,W,H);
  x.fillStyle='#2f7d4f';x.fillRect(0,0,6,H);x.fillRect(W-6,0,6,H);
  x.fillStyle='#e9e9e9';
  for(let i=1;i<LANES;i++)for(let y=-40+off%80;y<H;y+=80)x.fillRect(i*LW-2,y,4,40);
  enemies.forEach(e=>car(e.x,e.y,e.c));
  car(px,H-70,'#e4572e');
}
function move(d){if(!running)return;lane=Math.max(0,Math.min(LANES-1,lane+d))}
function end(){
  running=false;
  if(score>best){best=score;bsEl.textContent=best;try{localStorage.setItem('raceBest',best)}catch(e){}}
  document.getElementById('t').textContent='انتهت اللعبة';
  document.getElementById('m').textContent='نتيجتك: '+score;
  document.getElementById('go').textContent='العب مرة أخرى';
  ov.style.display='flex';
}
function tick(t){
  if(!running)return;
  const dt=Math.min((t-last)/1000,.05);last=t;
  px+=(lane*LW+LW/2-px)*Math.min(1,dt*14);
  off+=speed*dt;speed+=dt*6;score+=Math.round(speed*dt/10);
  spawn-=dt;
  if(spawn<=0){
    const l=Math.floor(Math.random()*LANES);
    enemies.push({x:l*LW+LW/2,y:-CH,c:colors[Math.floor(Math.random()*colors.length)],v:speed*.35});
    spawn=Math.max(.45,1.1-speed/900);
  }
  for(const e of enemies){
    e.y+=(speed-e.v)*dt;
    if(Math.abs(e.x-px)<CW-6&&Math.abs(e.y-(H-70))<CH-8){end();break}
  }
  enemies=enemies.filter(e=>e.y<H+CH);
  scEl.textContent=score;draw();
  if(running)requestAnimationFrame(tick);
}
function start(){reset();ov.style.display='none';running=true;last=performance.now();requestAnimationFrame(tick)}
document.getElementById('go').onclick=start;
document.getElementById('L').onclick=()=>move(-1);
document.getElementById('R').onclick=()=>move(1);
addEventListener('keydown',e=>{
  if(e.key==='ArrowLeft'||e.key==='a')move(-1);
  else if(e.key==='ArrowRight'||e.key==='d')move(1);
  else if((e.key==='Enter'||e.key===' ')&&!running){e.preventDefault();start()}
});
reset();draw();
</script>
</body>
</html>
